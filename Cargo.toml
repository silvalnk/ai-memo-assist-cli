[package]
name = "memo-assist"
version = "0.1.0"
edition = "2021"
description = "MemoAssist — lab mínimo de RAG + Skills (Rust + Lua)"
license = "MIT"

[[bin]]
name = "memo-assist"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
